<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Predictor</title>

    <!DOCTYPE html>

    <html>

    <head>
        <title>Student Performance Predictor</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            body {
                background: linear-gradient(135deg, #4e5be5, #6f7df7);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .box {
                background: white;
                width: 650px;
                padding: 25px;
                border-radius: 15px;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            }

            h2 {
                text-align: center;
                color: #2c3e50;
                margin-bottom: 20px;
            }

            .form-group {
                margin-bottom: 15px;
                text-align: left;
            }

            label {
                display: block;
                font-weight: bold;
                color: #333;
                margin-bottom: 6px;
            }

            input,
            select {
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                outline: none;
                font-size: 14px;
                transition: 0.3s;
            }

            input:focus,
            select:focus {
                border-color: #4e5be5;
                box-shadow: 0 0 5px rgba(78, 91, 229, 0.4);
            }

            button {
                width: 100%;
                padding: 12px;
                background: #28a745;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;
            }

            button:hover {
                background: #218838;
            }

            h3 {
                margin-top: 20px;
                text-align: center;
                color: #4e5be5;
            }
        </style>

    </head>

<body>
    <div class="box">
        <h2>Student Performance Predictor</h2>

        <form action="/predict" method="post">

            <div class="form-group">
                <label for="gender">Gender</label>
                <input id="gender" name="gender" placeholder="male / female">
            </div>

            <div class="form-group">
                <label for="race">Race / Ethnicity</label>
                <input id="race" name="race" placeholder="group A / B / C">
            </div>

            <div class="form-group">
                <label for="parental">Parental Education</label>
                <input id="parental" name="parental" placeholder="Bachelor's degree, Master's degree, etc.">
            </div>

            <div class="form-group">
                <label for="lunch">Lunch</label>
                <input id="lunch" name="lunch" placeholder="standard / free-reduced">
            </div>

            <div class="form-group">
                <label for="test">Test Preparation Course</label>
                <input id="test" name="test" placeholder="completed / none">
            </div>

            <div class="form-group">
                <label for="math">Math Score</label>
                <input id="math" name="math" type="number" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="form-group">
                <label for="reading">Reading Score</label>
                <input id="reading" name="reading" type="number" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="form-group">
                <label for="writing">Writing Score</label>
                <input id="writing" name="writing" type="number" min="0" max="100" placeholder="0 - 100">
            </div>

            <button type="submit">Predict Score</button>

        </form>

        {% if result %}
        <h3>Prediction Result: {{ result }}</h3>
        {% endif %}
    </div>

</body>

</html>


</body>

</html>
